spring.application.name=cp25ssi2
spring.datasource.url=jdbc:mysql://${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
google.client-id=${GOOGLE_CLIENT_ID}

server.servlet.context-path=/api/v1
server.port=8080


jwt.secret=${JWT_SECRET}
#jwt.max-token-interval-hour=10000
# 1 hrs.
jwt.max-token-interval-hour=3600000
# 24 hrs.
#jwt.max-token-interval-hour=86400000

jwt.refresh-secret=${JWT_REFRESH_SECRET}
# 7 days
jwt.max-refresh-token-interval-hour=604800000 
# 30 days
#jwt.max-refresh-token-interval-hour=2592000000

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:127.0.0.1}
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0

iapp.face.endpoint=https://api.iapp.co.th/v3/store/ekyc/face-verification
iapp.face.apikey=${IAPP_FACE_APIKEY}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

firebase.config.path=${FIREBASE_CONFIG_PATH}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.jpa.properties.hibernate.show_sql=true