spring.application.name=cp25ssi2
spring.datasource.url=jdbc:mysql://${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.jdbc.time_zone=UTC
#
## Jackson: serialize dates as ISO-8601 string (with Z suffix = UTC) not timestamps
#spring.jackson.serialization.write-dates-as-timestamps=false
#spring.jackson.time-zone=UTC
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
google.client-id=${GOOGLE_CLIENT_ID}

server.servlet.context-path=/api/v1
server.port=8080

jwt.secret=${JWT_SECRET}
#jwt.max-token-interval-hour=10000
# 1 hrs.
#jwt.max-token-interval-hour=3600000
jwt.max-token-interval-hour=2
# 24 hrs.
#jwt.max-token-interval-hour=86400000

jwt.refresh-secret=${JWT_REFRESH_SECRET}
# 7 days
#jwt.max-refresh-token-interval-hour=604800000
# 30 days
#jwt.max-refresh-token-interval-hour=2592000000
jwt.max-refresh-token-interval-hour=720

spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0

smsmkt.apiKey=${SMS_API_KEY}
smsmkt.secretKey=${SMS_SECRET_KEY}
smsmkt.projectKey=${SMS_PROJECT_KEY}

iapp.face.endpoint=https://api.iapp.co.th/v3/store/ekyc/face-verification
iapp.face.apikey=${IAPP_FACE_APIKEY}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

firebase.config.path=${FIREBASE_CONFIG_PATH}

gemini.apiKey=${GEMINI_API_KEY}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.jpa.properties.hibernate.show_sql=true

google.map.id=${GOOGLE_MAP_ID}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

admin.password=${ADMIN_PASSWORD}