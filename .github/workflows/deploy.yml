name: Deploy to Server

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend/cp25ssi2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Sync backend code to deployed path
        working-directory: .
        run: rsync -av --delete backend/cp25ssi2/ "$HOME/backend/"

      - name: Deploy with docker compose
        working-directory: .
        env:
          BUILDKIT_PROGRESS: plain
          DOCKER_BUILDKIT: '0'
        run: |
          sudo /usr/bin/env DOCKER_BUILDKIT=0 COMPOSE_DOCKER_CLI_BUILD_METADATA=0 /snap/bin/docker compose -f "$HOME/docker-compose.yml" down
          sudo /usr/bin/env DOCKER_BUILDKIT=0 COMPOSE_DOCKER_CLI_BUILD_METADATA=0 /snap/bin/docker compose -f "$HOME/docker-compose.yml" up -d --build backend
