name: chat2date
description: 'A new Flutter project.'
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.3
  flutter_dotenv: ^6.0.0
  dropdown_button2: ^2.3.9

  # === UI / Routing ===
  percent_indicator: ^4.2.5
  flutter_svg: ^2.0.10
  go_router: ^16.3.0
  sliding_up_panel: ^2.0.0+1
  flutter_fortune_wheel: ^1.3.0

  # === Utils ===
  intl: ^0.19.0
  http: ^1.2.2
  google_sign_in: ^7.2.0
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  riverpod_generator: ^2.6.1
  flutter_secure_storage: ^9.2.4
  provider: ^6.1.5+1

  # === Media / Picker ===
  image_picker: ^1.2.0
  permission_handler: ^11.3.1

  # === Calendar / Slider / ML ===
  flutter_xlider: ^3.5.0
  google_mlkit_face_detection: ^0.13.1
  google_mlkit_commons: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # สำหรับ generate code (riverpod ฯลฯ)
  build_runner: ^2.4.11

  # === Splash & App Icon ===
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  # === เพิ่ม assets ที่ใช้ในโปรเจกต์ ===
  assets:
    - assets/icons/
    - assets/images/
    - .env

  # === ฟอนต์ (Inter / Itim) ===
  fonts:
    - family: Inter
      fonts:
        # น้ำหนักทั้งหมด (100–900) จากไฟล์ variable
        - asset: assets/fonts/Inter/Inter-VariableFont_opsz,wght.ttf
        # ตัวเอียงทั้งหมดจากไฟล์ italic variable
        - asset: assets/fonts/Inter/Inter-Italic-VariableFont_opsz,wght.ttf
          style: italic

    - family: Itim
      fonts:
        - asset: assets/fonts/Inter/Inter-VariableFont_opsz,wght.ttf
          weight: 400

# ==============================
#   CONFIG: Splash Screen
# ==============================
flutter_native_splash:
  # พื้นหลัง (จะยังขาวเหมือนเดิม)
  color: "#FFFFFF"

  # ใช้ไฟล์โลโก้เวอร์ชันสำหรับ splash ที่ตัวโลโก้ใหญ่ขึ้น
  image: assets/images/logo_chat2date_splash.png

  # ช่วยจัดการการวางภาพ (ไม่บังคับ แต่แนะนำ)
  android_gravity: center          # จัดภาพไว้กลางจอ
  ios_content_mode: scaleAspectFit # ขยายให้เต็มเท่าที่จะเต็มได้โดยไม่บิด

  fullscreen: true                 # ซ่อน status bar ให้ splash ดูเต็มหน้าจอมากขึ้น

  android_12:
    color: "#FFFFFF"
    image: assets/images/logo_chat2date_splash.png
    # ถ้าโลโก้เป็นทรงกลมหรือมีพื้นหลังเองแล้ว ตรงนี้ไม่ต้องใส่ก็ได้
    # icon_background_color: "#FFFFFF"

  web: false

# ==============================
#   CONFIG: App Icon
# ==============================
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo_chat2date.png
  remove_alpha_ios: true
  min_sdk_android: 21
