name: chat2date
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # === เพิ่มสำหรับ Calendar ===
  flutter_svg: ^2.0.10+1   # ใช้แสดงไอคอน X (SVG)
  intl: ^0.19.0            # (เผื่อใช้ format ชื่อเดือน/เวลาในอนาคต)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # === เพิ่ม assets ที่ใช้ในโปรเจกต์ ===
  assets:
    - assets/icons/                 # โฟลเดอร์ไอคอน (รวม close_x.svg)
    # ถ้ามีรูปอื่น ๆ ให้สร้างโฟลเดอร์เพิ่ม เช่น:
    # - assets/images/
    # - assets/svg/

  # === ฟอนต์ (Inter / Itim) ===
  fonts:
    - family: Inter
      fonts:
        # น้ำหนักทั้งหมด (100–900) จากไฟล์ variable
        - asset: assets/fonts/Inter/Inter-VariableFont_opsz,wght.ttf
        # ตัวเอียงทั้งหมดจากไฟล์ italic variable
        - asset: assets/fonts/Inter/Inter-Italic-VariableFont_opsz,wght.ttf
          style: italic

    - family: Itim
      fonts:
        - asset: assets/fonts/Itim/Itim-Regular.ttf
          weight: 400
