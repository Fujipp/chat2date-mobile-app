name: chat2date
description: 'A new Flutter project.'
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  camera: ^0.11.3

  # === ENV / Config ===
  flutter_dotenv: ^6.0.0

  # === UI / Routing ===
  dropdown_button2: ^2.3.9
  percent_indicator: ^4.2.5
  flutter_svg: ^2.0.10
  go_router: ^16.3.0
  sliding_up_panel: ^2.0.0+1
  flutter_fortune_wheel: ^1.3.0

  # === Utils ===
  intl: ^0.19.0
  http: ^1.2.2
  google_sign_in: ^7.2.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  provider: ^6.1.5+1

  # === Media / Picker ===
  image_picker: ^1.2.0
  permission_handler: ^11.3.1

  # === Calendar / Slider / ML ===
  flutter_xlider: ^3.5.0
  google_mlkit_face_detection: ^0.13.1
  google_mlkit_commons: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # สำหรับ generate code (riverpod ฯลฯ)
  build_runner: ^2.4.11
  riverpod_annotation: ^2.6.1
  riverpod_generator: ^2.6.1

  # === Splash & App Icon ===
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - .env

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-VariableFont_opsz,wght.ttf
        - asset: assets/fonts/Inter/Inter-Italic-VariableFont_opsz,wght.ttf
          style: italic

    - family: Itim
      fonts:
        - asset: assets/fonts/Inter/Inter-VariableFont_opsz,wght.ttf
          weight: 400

# ==============================
#   CONFIG: Splash Screen
# ==============================
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo_chat2date_splash.png

  android_gravity: center
  ios_content_mode: scaleAspectFit
  fullscreen: true

  android_12:
    color: "#FFFFFF"
    image: assets/images/logo_chat2date_splash.png

  web: false

# ==============================
#   CONFIG: App Icon
# ==============================
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo_chat2date.png
  remove_alpha_ios: true
  min_sdk_android: 21
  