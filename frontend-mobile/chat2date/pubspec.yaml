name: chat2date
description: 'A new Flutter project.'
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # === เพิ่มสำหรับ Calendar ===
  flutter_svg: ^2.0.10 # ใช้แสดงไอคอน X (SVG)
  intl: ^0.19.0 # (เผื่อใช้ format ชื่อเดือน/เวลาในอนาคต)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_fortune_wheel: ^1.3.0
  percent_indicator: ^4.2.5

flutter:
  uses-material-design: true

  # === เพิ่ม assets ที่ใช้ในโปรเจกต์ ===
  assets:
    - assets/icons/
    - assets/images/

  # === ฟอนต์ (Inter / Itim) ===
  fonts:
    - family: Inter
      fonts:
        # น้ำหนักทั้งหมด (100–900) จากไฟล์ variable
        - asset: assets/fonts/Inter/Inter-VariableFont_opsz,wght.ttf
        # ตัวเอียงทั้งหมดจากไฟล์ italic variable
        - asset: assets/fonts/Inter/Inter-Italic-VariableFont_opsz,wght.ttf
          style: italic

    - family: Itim
      fonts:
        - asset: assets/fonts/Itim/Itim-Regular.ttf
          weight: 400
