name: chat2date
description: 'A new Flutter project.'
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # === UI / Routing ===
  flutter_svg: ^2.0.10
  go_router: ^16.3.0

  # === Utils ===
  intl: ^0.19.0
  http: ^1.2.2

  # === Media / Picker ===
  image_picker: ^1.2.0     # ใช้เวอร์ชันที่มีอยู่ (ใหม่กว่า 1.1.2)
  permission_handler: ^11.3.1

  # === Calendar / Slider ===
  flutter_xlider: ^3.5.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_fortune_wheel: ^1.3.0
  percent_indicator: ^4.2.5
  sliding_up_panel: ^2.0.0+1

flutter:
  uses-material-design: true

  # === เพิ่ม assets ที่ใช้ในโปรเจกต์ ===
  assets:
    - assets/icons/
    - assets/images/

  # === ฟอนต์ (Inter / Itim) ===
  fonts:
    - family: Inter
      fonts:
        # น้ำหนักทั้งหมด (100–900) จากไฟล์ variable
        - asset: assets/fonts/Inter/Inter-VariableFont_opsz,wght.ttf
        # ตัวเอียงทั้งหมดจากไฟล์ italic variable
        - asset: assets/fonts/Inter/Inter-Italic-VariableFont_opsz,wght.ttf
          style: italic

    - family: Itim
      fonts:
        - asset: assets/fonts/Itim/Itim-Regular.ttf
          weight: 400
